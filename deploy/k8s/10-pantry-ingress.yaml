---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pantry-tls
  namespace: pantry
spec:
  secretName: pantry-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pantry.machinecity.net
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pantry
  namespace: pantry
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`pantry.machinecity.net`) && !Path(`/mcp`)
      kind: Rule
      services:
        - name: pantry
          port: 8080
  tls:
    secretName: pantry-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pantry-allow-traefik
  namespace: pantry
spec:
  podSelector:
    matchLabels: { app: pantry }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
